[package]
name = "liber-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mupdf = { path = "vendor/mupdf", default-features = false, features = ["base14-fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
