[package]
name = "liber"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/liber-core"]
default-members = [".", "crates/liber-core"]
resolver = "3"

[patch.crates-io]
mupdf = { path = "crates/liber-core/vendor/mupdf" }

[dependencies]
nsh-core = "0.2.0"
nsh-base = "0.2.0"
env_logger = "0.11"
serde_json = "1.0.151"
rfd = "0.15"
liber-core = { path = "crates/liber-core" }
imago-native-sidebar = { path = "../imago-sidebar-wt/crates/imago-native-sidebar" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.2.0", default-features = false }
imago-window-macos = { path = "../imago-sidebar-wt/crates/imago-window-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.2.0", default-features = false }
