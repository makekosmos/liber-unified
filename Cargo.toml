[package]
name = "liber"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/liber-core"]
default-members = [".", "crates/liber-core"]
resolver = "3"

[patch.crates-io]
mupdf = { path = "crates/liber-core/vendor/mupdf" }
gpui-pre = { git = "https://github.com/makekosmos/imago.git", branch = "feat/gpui-native-split" }
gpui-pre-macos = { git = "https://github.com/makekosmos/imago.git", branch = "feat/gpui-native-split" }

[dependencies]
nsh-core = "0.2.0"
nsh-base = "0.2.0"
env_logger = "0.11"
serde_json = "1.0.151"
rfd = "0.15"
liber-core = { path = "crates/liber-core" }
gpui = { package = "gpui-kit", version = "=0.8.0", features = ["gpui-fast"] }

[dev-dependencies]
nsh-engine = { version = "0.2.0", default-features = false }
nsh-testing = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.2.0", default-features = false }
imago-native-sidebar = { git = "https://github.com/makekosmos/imago.git", branch = "feat/gpui-native-split" }
imago-window-macos = { git = "https://github.com/makekosmos/imago.git", branch = "feat/gpui-native-split" }
imago-gpui-native-split = { git = "https://github.com/makekosmos/imago.git", branch = "feat/gpui-native-split" }
raw-window-handle = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBezierPath", "NSButton", "NSButtonCell", "NSColor", "NSControl", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.2.0", default-features = false }
