[package]
name = "liber-gpui"
version = "0.1.0"
edition = "2021"
description = "Liber: local-first GPUI book library and PDF reader"
default-run = "liber-gpui"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.7.1" }
gpui-component = "=0.7.1"
gpui-base = "=0.7.1"
# Shared Imago visual core: palettes, theme, sidebar/titlebar chrome, buttons.
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "86c830675480e96b3ec21b500059410ad4c0b852" }
hayro = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
dirs = "6"
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }
ureq = "3"
smallvec = "1"
async-channel = "2"
raw-window-handle = "0.6"
tree-sitter-highlight = "=0.25.10"
tree-sitter-javascript = "=0.25.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.7.1", features = ["test-support"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.release]
debug = false
debug-assertions = false

[profile.release.build-override]
debug-assertions = false
opt-level = 0

[profile.dev.package.gpui-pre]
debug-assertions = true

[profile.dev.package.gpui-pre-macros]
debug-assertions = true

[patch.crates-io]
gpui-pre = { git = "https://github.com/makekosmos/imago.git", rev = "86c830675480e96b3ec21b500059410ad4c0b852" }
gpui-pre-windows = { git = "https://github.com/makekosmos/imago.git", rev = "86c830675480e96b3ec21b500059410ad4c0b852" }

# Standalone crate, like the other GPUI apps.
[workspace]
